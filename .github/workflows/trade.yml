name: Zero-Cost Trading Bot

on:
  schedule:
    # UTC Times (KST - 9 hours)
    # Domestic (09:00 - 15:30 KST) -> (00:00 - 06:30 UTC)
    # Run every hour (at minute 0)
    - cron: '0 0-6 * * 1-5'
    
    # US (22:30 - Early Morning KST) -> (13:30 - ... UTC)
    # Run every hour (at minute 0)
    - cron: '0 13-21 * * 1-5'
    
    # Briefing Schedule
    # Morning Briefing (08:30 KST -> 23:30 UTC previous day)
    - cron: '30 23 * * 1-5'
    # Evening Briefing (16:00 KST -> 07:00 UTC)
    - cron: '0 7 * * 1-5'
  workflow_dispatch: # Allow manual run button

permissions:
  contents: write
  pages: write
  id-token: write



jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run Trading Bot
      env:
        KIS_MODE: ${{ secrets.KIS_MODE }}
        
        # Virtual Account Keys
        KIS_APP_KEY_VIRTUAL: ${{ secrets.KIS_APP_KEY_VIRTUAL }}
        KIS_APP_SECRET_VIRTUAL: ${{ secrets.KIS_APP_SECRET_VIRTUAL }}
        KIS_CANO_VIRTUAL: ${{ secrets.KIS_CANO_VIRTUAL }}
        KIS_ACNT_PRDT_CD_VIRTUAL: ${{ secrets.KIS_ACNT_PRDT_CD_VIRTUAL }}
        
        # Real Account Keys
        KIS_APP_KEY_REAL: ${{ secrets.KIS_APP_KEY_REAL }}
        KIS_APP_SECRET_REAL: ${{ secrets.KIS_APP_SECRET_REAL }}
        KIS_CANO_REAL: ${{ secrets.KIS_CANO_REAL }}
        KIS_ACNT_PRDT_CD_REAL: ${{ secrets.KIS_ACNT_PRDT_CD_REAL }}
        
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        DISCORD_WEBHOOK_TRADING: ${{ secrets.DISCORD_WEBHOOK_TRADING }}
        DISCORD_WEBHOOK_BRIEFING: ${{ secrets.DISCORD_WEBHOOK_BRIEFING }}
      run: python main.py
      
    - name: Prepare GitHub Pages
      run: |
        mkdir -p reports
        cp index.html reports/index.html
      
    - name: Commit and Push Report
      run: |
        git config --global user.name 'Trading Bot'
        git config --global user.email 'bot@noreply.github.com'
        git pull --rebase origin master || true
        git add reports/
        git commit -m "Automated Trading Report [$(date)]" || echo "No changes to commit"
        git push

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./reports
        keep_files: true  # Keep existing reports
        user_name: 'Trading Bot'
        user_email: 'bot@noreply.github.com'

  briefing:
    runs-on: ubuntu-latest
    if: github.event.schedule == '30 23 * * 1-5' || github.event.schedule == '0 7 * * 1-5' || github.event_name == 'workflow_dispatch'
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run Briefing
      env:
        KIS_MODE: ${{ secrets.KIS_MODE }}
        
        # Virtual Keys
        KIS_APP_KEY_VIRTUAL: ${{ secrets.KIS_APP_KEY_VIRTUAL }}
        KIS_APP_SECRET_VIRTUAL: ${{ secrets.KIS_APP_SECRET_VIRTUAL }}
        KIS_CANO_VIRTUAL: ${{ secrets.KIS_CANO_VIRTUAL }}
        
        # Real Keys
        KIS_APP_KEY_REAL: ${{ secrets.KIS_APP_KEY_REAL }}
        KIS_APP_SECRET_REAL: ${{ secrets.KIS_APP_SECRET_REAL }}
        KIS_CANO_REAL: ${{ secrets.KIS_CANO_REAL }}

        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        DISCORD_WEBHOOK_TRADING: ${{ secrets.DISCORD_WEBHOOK_TRADING }}
        DISCORD_WEBHOOK_BRIEFING: ${{ secrets.DISCORD_WEBHOOK_BRIEFING }}
      run: python briefing.py
      
    - name: Commit and Push Briefing
      run: |
        git config --global user.name 'Briefing Bot'
        git config --global user.email 'bot@noreply.github.com'
        git pull --rebase origin master || true
        git add reports/
        git commit -m "Market Briefing [$(date)]" || echo "No changes to commit"
        git push
