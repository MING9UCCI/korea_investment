
    <!DOCTYPE html>
    <html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Daily Trading Report - 2026-02-16</title>
        <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
        <style>
            :root {
                --bg-color: #0f172a;
                --card-bg: rgba(30, 41, 59, 0.7);
                --accent-color: #3b82f6;
                --text-primary: #f8fafc;
                --text-secondary: #94a3b8;
                --buy-color: #f87171;
                --sell-color: #60a5fa;
                --glass-border: 1px solid rgba(255, 255, 255, 0.1);
            }

            body {
                font-family: 'Outfit', sans-serif;
                background-color: var(--bg-color);
                background-image: 
                    radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                    radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.15) 0px, transparent 50%);
                color: var(--text-primary);
                min-height: 100vh;
                padding: 40px 20px;
                margin: 0;
            }

            .container {
                max-width: 1000px;
                margin: 0 auto;
            }

            header {
                text-align: center;
                margin-bottom: 40px;
            }

            h1 {
                font-size: 2.5rem;
                font-weight: 700;
                background: linear-gradient(to right, #60a5fa, #c084fc);
                -webkit-background-clip: text;
                background-clip: text;
                -webkit-text-fill-color: transparent;
                margin-bottom: 10px;
            }
            
            .back-link {
                display: inline-block;
                margin-top: 10px;
                color: var(--text-secondary);
                text-decoration: none;
                font-size: 0.9rem;
                transition: color 0.2s;
            }
            
            .back-link:hover {
                color: var(--accent-color);
            }

            .summary-card {
                background: var(--card-bg);
                backdrop-filter: blur(12px);
                border: var(--glass-border);
                border-radius: 16px;
                padding: 25px;
                margin-bottom: 30px;
                display: flex;
                justify-content: space-around;
                text-align: center;
            }
            
            .card-item h3 {
                color: var(--text-secondary);
                font-size: 0.9rem;
                text-transform: uppercase;
                margin-bottom: 5px;
            }
            
            .card-item p {
                font-size: 1.5rem;
                font-weight: 700;
                color: var(--text-primary);
            }

            table {
                width: 100%;
                border-collapse: separate;
                border-spacing: 0;
                background: var(--card-bg);
                backdrop-filter: blur(12px);
                border-radius: 16px;
                border: var(--glass-border);
                overflow: hidden;
            }

            th, td {
                padding: 15px 20px;
                text-align: left;
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            }

            th {
                background: rgba(255, 255, 255, 0.05);
                color: var(--text-secondary);
                font-weight: 600;
                font-size: 0.85rem;
                text-transform: uppercase;
                letter-spacing: 0.05em;
            }

            tr:last-child td {
                border-bottom: none;
            }

            tr:hover td {
                background: rgba(255, 255, 255, 0.03);
            }

            .buy { color: var(--buy-color); font-weight: 600; }
            .sell { color: var(--sell-color); font-weight: 600; }
            .hold { color: var(--text-secondary); }
            
            .tag {
                padding: 4px 8px;
                border-radius: 6px;
                font-size: 0.8rem;
                font-weight: 600;
            }
            
            .tag.buy { background: rgba(248, 113, 113, 0.15); }
            .tag.sell { background: rgba(96, 165, 250, 0.15); }
            .tag.hold { background: rgba(148, 163, 184, 0.15); }

            .ai-score {
                font-weight: bold;
            }
            .positive { color: #4ade80; }
            .negative { color: #f87171; }
        </style>
    </head>
    <body>
        <div class="container">
            <header>
                <h1>Daily Trading Report</h1>
                <p style="color: var(--text-secondary);">2026-02-16</p>
                <a href="../index.html" class="back-link">&larr; Back to Dashboard</a>
            </header>

            <div class="summary-card">
                <div class="card-item">
                    <h3>Total Scans</h3>
                    <p>0</p>
                </div>
                <div class="card-item">
                    <h3>Last Update</h3>
                    <p>14:39:08</p>
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Market</th>
                        <th>Code</th>
                        <th>Name</th>
                        <th>Signal</th>
                        <th>AI Score</th>
                        <th>Reason</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
    
                </tbody>
            </table>
        </div>
    </body>
    </html>
