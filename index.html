<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Auto-Trading | Dashboard</title>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent-color: #3b82f6;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --up-color: #f87171;
            /* Red for UP (Korea) */
            --down-color: #60a5fa;
            /* Blue for DOWN (Korea) */
            --glass-border: 1px solid rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            background-image:
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.15) 0px, transparent 50%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 40px;
            padding-top: 20px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: var(--glass-border);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .card-title {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 15px;
        }

        .card-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .card-sub {
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .up {
            color: var(--up-color);
        }

        .down {
            color: var(--down-color);
        }

        /* Chart Section */
        .chart-wrapper {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 30px;
            height: 400px;
            position: relative;
        }

        /* Reports List */
        .reports-section h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            padding-left: 10px;
            border-left: 4px solid var(--accent-color);
        }

        .reports-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .report-link {
            display: block;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.2s;
        }

        .report-link:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
            color: var(--accent-color);
        }

        .report-date {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .loading {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }

            .card-value {
                font-size: 1.5rem;
            }

            .chart-wrapper {
                height: 300px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>STOCK AI DASHBOARD</h1>
            <p class="subtitle">Autonomous Trading & Asset Management</p>
        </header>

        <!-- Stats Overview -->
        <div class="stats-grid">
            <div class="card">
                <div class="card-title">Total Net Worth</div>
                <div class="card-value" id="totalAsset">Loading...</div>
                <div class="card-sub" id="assetChange">-</div>
            </div>

            <div class="card">
                <div class="card-title">Total Profit / Loss</div>
                <div class="card-value" id="totalProfit">Loading...</div>
                <div class="card-sub" id="profitRate">-</div>
            </div>
        </div>

        <!-- Main Chart -->
        <div class="chart-wrapper">
            <canvas id="mainChart"></canvas>
        </div>

        <!-- Reports -->
        <div class="reports-section">
            <h2>Daily Reports</h2>
            <div class="reports-grid" id="reportList">
                <div class="loading">Fetching Data...</div>
            </div>
        </div>
    </div>

    <script>
        const REPO_OWNER = 'MING9UCCI';
        const REPO_NAME = 'korea_investment';
        const BRANCH = 'gh-pages';

        async function init() {
            await loadData();
            await loadReports();
        }

        async function loadData() {
            try {
                // Try fetching from root first (dev) or relative if deployed
                const res = await fetch('./daily_summary.json');
                if (!res.ok) throw new Error("No summary data");
                const data = await res.json();

                if (data.length === 0) return;

                const latest = data[data.length - 1];
                const prev = data.length > 1 ? data[data.length - 2] : latest;

                // 1. Update Cards
                // Total Asset
                document.getElementById('totalAsset').innerText = latest.net_asset.toLocaleString() + ' KRW';

                // Asset Change
                const change = latest.net_asset - prev.net_asset;
                const changeP = ((change / prev.net_asset) * 100).toFixed(2);
                const sign = change >= 0 ? '+' : '';
                const colorClass = change >= 0 ? 'up' : 'down';
                document.getElementById('assetChange').innerHTML =
                    `<span class="${colorClass}">${sign}${change.toLocaleString()} (${sign}${changeP}%)</span> vs Yesterday`;

                // Calculate Profit (Approximation from Net Asset vs Seed or provided fields)
                // Note: daily_summary.json structure: {date, net_asset, total_profit (optional), profit_rate (optional)}
                // If profit fields missing, we can only show Asset.
                // Assuming we might record profit later. For now, use Asset Change logic or placeholders if data missing.

                // If daily_summary.py saves profit, we use it. If not, we iterate.
                // Let's assume daily_summary.json ONLY has date/net_asset for now based on previous code.
                // I will update daily_summary.py later to include profit info.
                // For now, let's just duplicate Asset Analysis or leave Profit placeholder.

                document.getElementById('totalProfit').innerText = "N/A"; // Need update in daily_summary.py
                document.getElementById('profitRate').innerText = "Update Script Needed";

                // 2. Render Chart
                renderChart(data);

            } catch (e) {
                console.error(e);
                document.getElementById('totalAsset').innerText = "No Data";
            }
        }

        function renderChart(data) {
            const ctx = document.getElementById('mainChart').getContext('2d');

            const gradient = ctx.createLinearGradient(0, 0, 0, 400);
            gradient.addColorStop(0, 'rgba(59, 130, 246, 0.5)'); // Blue
            gradient.addColorStop(1, 'rgba(59, 130, 246, 0.0)');

            const dates = data.map(d => d.date.slice(5));
            const assets = data.map(d => d.net_asset);

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: dates,
                    datasets: [{
                        label: 'Net Asset',
                        data: assets,
                        borderColor: '#60a5fa',
                        backgroundColor: gradient,
                        borderWidth: 3,
                        pointBackgroundColor: '#1e293b',
                        pointBorderColor: '#60a5fa',
                        pointBorderWidth: 2,
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            mode: 'index',
                            intersect: false,
                            backgroundColor: 'rgba(15, 23, 42, 0.9)',
                            titleColor: '#94a3b8',
                            bodyColor: '#f8fafc',
                            borderColor: 'rgba(255,255,255,0.1)',
                            borderWidth: 1
                        }
                    },
                    scales: {
                        x: {
                            grid: { display: false, color: '#334155' },
                            ticks: { color: '#94a3b8' }
                        },
                        y: {
                            grid: { color: '#334155', borderDash: [5, 5] },
                            ticks: { color: '#94a3b8' }
                        }
                    },
                    interaction: {
                        mode: 'nearest',
                        axis: 'x',
                        intersect: false
                    }
                }
            });
        }

        async function loadReports() {
            const list = document.getElementById('reportList');
            try {
                const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/?ref=${BRANCH}`);
                if (!res.ok) throw new Error("API Error");
                const files = await res.json();

                const reports = files
                    .filter(f => f.type === 'dir' && /^\d{4}-\d{2}-\d{2}$/.test(f.name))
                    .map(f => f.name)
                    .sort()
                    .reverse();

                if (reports.length === 0) {
                    list.innerHTML = '<div class="loading">No Reports Found</div>';
                    return;
                }

                list.innerHTML = reports.map(date => `
                    <a href="${date}/report.html" class="report-link">
                        <div class="report-date">${date}</div>
                        <div style="font-size:0.8rem; color:var(--text-secondary)">View Report &rarr;</div>
                    </a>
                `).join('');

            } catch (e) {
                console.error(e);
                list.innerHTML = '<div class="loading">Failed to load reports (API Rate Limit or Network)</div>';
            }
        }

        init();
    </script>
</body>

</html>
